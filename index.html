const audio = {};
for (const n in EMBEDDED_AUDIO) { audio[n] = new Audio(EMBEDDED_AUDIO[n]); }
function play(n){ try { if (audio[n]) { audio[n].currentTime=0; audio[n].play(); } } catch(e){} }

function setExpr(e){
  if (e === expr) return;
  // trigger transition
  prevExpr = expr;
  expr = e;
  transT = 0;
  document.getElementById('status').textContent = e;
  if (e==='HAPPY'||e==='LOVE') play('phee');
  else if (e==='ANGRY'||e==='HATE') play('hiss');
  else if (e==='SURPRISED') play('chirp');
  else if (e==='SLEEPY'||e==='SQUINT') play('grumble');
  else if (e==='SLEEP') play('sleep');
  else if (e==='DERPY') play('chirp');
  else if (e==='DRIFT') play('wake');
  // reset derpy/drift timelines
  if (e==='DERPY') { derpyStart = performance.now(); }
  if (e==='DRIFT') { driftStart = performance.now(); }
}

function cycle(){
  auto = !auto;
  if (auto) {
    autoIdx = 0; setExpr(EXPRS[0]);
    autoTimer = setInterval(() => { autoIdx=(autoIdx+1)%EXPRS.length; setExpr(EXPRS[autoIdx]); }, 2200);
  } else { clearInterval(autoTimer); }
}

  DRIFT:     {topLid:0, bottomLid:160, browL:0, browR:0, scleraR:70, pr:34, happy:false, sleepy:false, squint:false, happyP:0, loveP:0},
};

function lerp(a,b,t){ return a + (b-a)*t; }

// Blink state
let openness = 1.0;
let blinkPhase = 0;
let blinkTimer = 0;
let nextBlink = 2000 + Math.random()*2000;
let lastSleepSound = 0;

// Derpy state
let derpyStart = 0;
// Drift state
let driftStart = 0;

function updateBlink(dt){
  // skip blink in sleep/sleepy/derpy (derpy handles its own)
  if (expr==='SLEEP' || expr==='SLEEPY' || expr==='DERPY') return;
  blinkTimer += dt;
  if (blinkPhase===0 && blinkTimer>nextBlink) { blinkPhase=1; blinkTimer=0; }
  if (blinkPhase===1) {
    openness = Math.max(0, openness - dt/55);
    if (openness<=0) { blinkPhase=2; }
  } else if (blinkPhase===2) {
    openness = Math.min(1, openness + dt/120);
    if (openness>=1) { blinkPhase=0; blinkTimer=0; nextBlink=2000+Math.random()*3000; }
  }
}

function derpyOpenness(isLeft, now){
  const elapsed = (now - derpyStart) / 1000;
  const cycle = 2.0;
  const offset = isLeft ? 0 : 0.7;
  const t = ((elapsed - offset) % cycle + cycle) % cycle;
  if (t < 0.2) {
    const u = t / 0.2;
    return 1.0 - u*u;
  } else if (t < 0.5) {
    return 0.0;
  } else if (t < 0.9) {
    const u = (t - 0.5) / 0.4;
    return u*u*(3-2*u);
  }
  return 1.0;
}

function driftOffset(isLeft, now){
  const elapsed = (now - driftStart) / 1000;
  // very slow drift: 3.5s drift apart, 1.0s snap back, repeat every 6s
  const cycle = elapsed % 6.0;
  let x = 0;
  if (cycle < 3.5) {
    const u = cycle / 3.5;
    x = u*u*(3-2*u) * 34;
  } else if (cycle < 4.5) {
    const u = (cycle-3.5)/1.0;
    x = 34*(1 - u*u*(3-2*u));
  } else {
    x = 0;
  }
  // subtle wobble so eyes move around a little
  x += Math.sin(elapsed*0.7 + (isLeft?0:1.2)) * 4;
  return isLeft ? -x : x;
}

function lerpCur(target, dt){
  const k = Math.min(1, dt/60); // per-frame lerp toward target
  const rate = 0.18;
  cur.topLid = lerp(cur.topLid, target.topLid, rate);
  cur.bottomLid = lerp(cur.bottomLid, target.bottomLid, rate);
  cur.browL = lerp(cur.browL, target.browL, rate);
  cur.browR = lerp(cur.browR, target.browR, rate);
  cur.scleraR = lerp(cur.scleraR, target.scleraR, rate);
  cur.pr = lerp(cur.pr, target.pr, rate);
  cur.happy = target.happy;
  cur.sleepy = target.sleepy;
  cur.squint = target.squint;
  cur.happyP = lerp(cur.happyP, target.happyP, rate);
  cur.loveP = lerp(cur.loveP, target.loveP, rate);
}

function drawEye(cx, cy, e, isLeft, t, op){
  ctx.fillStyle = '#2d323e';
  ctx.beginPath(); ctx.arc(cx,cy,80,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx,cy,78,0,Math.PI*2); ctx.fill();

  if (e === 'SLEEP') {
    // subtle breath lift synced to 3.6s breathing cycle
    const bt = ((performance.now()/1000) % 3.6) / 3.6;
    const inh = Math.exp(-Math.pow((bt - 0.22)/0.11, 2));
    const bY = inh * 2;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let dx=-42; dx<=42; dx++){
      const dy = (dx*dx)/110;
      const x = cx+dx, y = cy+4 - dy - bY;
      if (dx===-42) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    return;
  }

  const scleraR = Math.round(cur.scleraR);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx,cy,scleraR,0,Math.PI*2); ctx.fill();

  // pupil pos
  let px=0, py=0, pr=Math.round(cur.pr);
  const target = TARGETS[e] || TARGETS.IDLE;
  // base offsets per emotion
  switch(e){
    case 'LOVE': py=-2; break;
    case 'HAPPY': py=-4; break;
    case 'SURPRISED': px=(Math.random()*6-3); py=(Math.random()*6-3); break;
    case 'ANGRY': py=2; break;
    case 'HATE': py=4; break;
    case 'SLEEPY': py=8; break;
    case 'LOOK_L': px=-24; py=-2; break;
    case 'LOOK_R': px=24; py=-2; break;
    case 'DRIFT': px = driftOffset(isLeft, performance.now()); py = Math.sin(performance.now()/1000*0.5 + (isLeft?0:Math.PI))*3; break;
    default: break;
  }
  if (e==='IDLE') {
    // balanced: quick but smooth saccades
    px = Math.sin(t*1.1)*14 + Math.sin(t*2.3)*6;
    py = Math.cos(t*0.8)*6 + Math.cos(t*1.9)*3;
  }
  if (e==='DERPY') {
    // eyes look slightly inward
    px = isLeft ? 6 : -6;
  }

  // smooth lerp pupil toward target
  // (use cur.pr already; px/py applied directly for snappy feel)

  ctx.fillStyle = '#212021';
  ctx.beginPath(); ctx.arc(cx+px, cy+py, pr+1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx+px, cy+py, pr, 0, Math.PI*2); ctx.fill();

  const hx = cx + px*0.85 - pr/3;
  const hy = cy + py*0.85 - pr/3;
  const hr = (e==='LOVE')?8:(e==='SURPRISED'?4:6);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fill();
  if (e==='LOVE'||e==='HAPPY'){
    ctx.beginPath(); ctx.arc(cx+px+pr/3, cy+py+pr/4, 3,0,Math.PI*2); ctx.fill();
    if (e==='LOVE') {
      // (heart drawn on top, unblocked, after all masks)
    }
  }

  // happy curve (animated) - smiling crescent
  if (cur.happyP > 0.01 && e !== 'LOVE') {
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy+54, 58*cur.happyP, 0, Math.PI*2); ctx.fill();
  }
  // love curve (animated)
  if (cur.loveP > 0.01) {
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy+64, 48*cur.loveP, 0, Math.PI*2); ctx.fill();
  }
  // squint
  if (cur.squint) {
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-80, cy-80, 160, cur.topLid);
    ctx.fillRect(cx-80, cy-80+cur.bottomLid, 160, 160-cur.bottomLid);
  }
  // sleepy
  if (cur.sleepy) {
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-80, cy-80, 160, cur.topLid);
    ctx.strokeStyle='#222'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(cx-68,cy-2); ctx.lineTo(cx+68,cy-2); ctx.stroke();
  }
  // angry/hate brow (animated browL/browR)
  if (cur.browL > 0.5) {
    const p = cur.browL / 72.0;
    const rY = Math.round(p * 72);  // right bottom y
    const lY = Math.round(p * 28);  // left bottom y
    ctx.fillStyle = '#000';
    if (isLeft) {
      ctx.beginPath();
      ctx.moveTo(cx-80, cy-80); ctx.lineTo(cx+80, cy-80); ctx.lineTo(cx+80, cy-80+rY); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx-80, cy-80); ctx.lineTo(cx-80, cy-80+lY); ctx.lineTo(cx+80, cy-80+rY); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(cx-80, cy-80); ctx.lineTo(cx+80, cy-80); ctx.lineTo(cx-80, cy-80+rY); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx+80, cy-80); ctx.lineTo(cx+80, cy-80+lY); ctx.lineTo(cx-80, cy-80+rY); ctx.closePath(); ctx.fill();
    }
  }
  // hate lower lid
  if (e==='HATE') {
    ctx.fillStyle = '#000';
    ctx.fillRect(cx-80, cy+32, 160, 48);
  }

  // animated top/bottom lid masks (smooth transition)
  ctx.fillStyle = '#000';
  if (cur.topLid > 0.5 && !cur.squint && !cur.sleepy) {
    ctx.fillRect(cx-80, cy-80, 160, cur.topLid);
  }
  if (cur.bottomLid < 159.5 && !cur.squint) {
    ctx.fillRect(cx-80, cy-80+cur.bottomLid, 160, 160-cur.bottomLid);
  }

  // blink mask
  ctx.fillStyle = '#000';
  op = openness;
  if (e==='DERPY') op = derpyOpenness(isLeft, performance.now());
  if (e==='SLEEP') op = 0;
  if (op < 0.99) {
    const lid = (1-op)*80;
    ctx.fillRect(cx-80, cy-80, 160, lid);
    ctx.fillRect(cx-80, cy+80-lid, 160, lid);
  }

  // LOVE: clean heart sparkle on top (unblocked)
  if (e==='LOVE') {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx-5, hy-3, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+5, hy-3, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx-11, hy+1); ctx.lineTo(hx, hy+14); ctx.lineTo(hx+11, hy+1); ctx.closePath(); ctx.fill();
  }
}

let last = performance.now();
function loop(now){
  const dt = now - last; last = now;

  // transition progress
  transT = Math.min(1, transT + dt/TRANS_DUR);

  // lerp current toward target for current emotion
  const target = TARGETS[expr] || TARGETS.IDLE;
  lerpCur(target, dt);

  updateBlink(dt);

  // sleeping sounds while in SLEEP
  if (expr==='SLEEP') {
    if (!lastSleepSound || now - lastSleepSound > 2800) {
      play('sleeploop');
      lastSleepSound = now;
    }
  }

  ctx.fillStyle = '#12141a';
  ctx.fillRect(0,0,320,160);
  const t = now/1000;
  drawEye(80,80,expr,true,t, (expr==='SLEEP')?0:openness);
  drawEye(240,80,expr,false,t, (expr==='SLEEP')?0:openness);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
